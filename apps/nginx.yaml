apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/prajwalS0209/argocdPractice.git
    targetRevision: main
    path: argocdPractice/kubedeploy/nginx.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd