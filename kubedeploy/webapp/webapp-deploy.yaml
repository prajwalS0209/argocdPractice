---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: webapp-deploy
  name: webapp-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-deploy
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: webapp-deploy
    spec:
      containers:
      - image: jeetkansagra07/ultimate-cicd:15803f5
        name: webapp
        ports:
        - containerPort: 8080
          name: http

---
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
spec:
  type: NodePort
  selector:
    app: webapp-deploy
  ports:
  - name: webapp-deploy-svc
    protocol: TCP
    port: 80
    targetPort: 8080
    

