apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app-multi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/prajwalS0209/argocdPractice.git
    targetRevision: multi-cluster
    path: apps
    directory:
      recurse: true
  destination:
    server: https://95.217.112.231:6443 
    namespace: superset
  syncPolicy:
    automated:
      prune: true
      selfHeal: true